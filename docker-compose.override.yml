services:
  auth.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Host=eventdb;Port=5432;Database=AuthDb;Username=postgres;Password=Eventbox123!
      - Jwt__Issuer=Eventbox.Auth
      - Jwt__Audience=Eventbox.Api
      - Jwt__SigningKey=U7Sknna8IkRyXFXqDrXK6ON+GPq39d0QWAK2gEX0mljWQUFkqiaVGL2Wn0nPIHiT
      - Jwt__ExpirationMinutes=120
    ports:
      - "8000:8080"
      - "8001:8081"
    depends_on:
      - eventdb
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  eventdb:
    container_name: eventdb
    environment:
      POSTGRES_DB: EventDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Eventbox123!
    restart: always
    ports:
      - "5432:5432"

  rabbitmq:
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  event.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Host=eventdb;Port=5432;Database=EventDb;Username=postgres;Password=Eventbox123!
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Jwt__Issuer=Eventbox.Auth
      - Jwt__Audience=Eventbox.Api
      - Jwt__SigningKey=U7Sknna8IkRyXFXqDrXK6ON+GPq39d0QWAK2gEX0mljWQUFkqiaVGL2Wn0nPIHiT
    ports:
      - "8010:8080"
      - "8011:8081"
    depends_on:
      - eventdb
      - rabbitmq
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  payment.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Host=eventdb;Port=5432;Database=PaymentDb;Username=postgres;Password=Eventbox123!
      - TicketingApi__BaseUrl=http://ticketing.api:8080
      - Payment__ProviderSignature=4JEqxrjVAk9I8euMZA44kTkNxW6pPO7ZRfREeTupUiE=
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    ports:
      - "8030:8080"
      - "8031:8081"
    depends_on:
      - eventdb
      - rabbitmq
      - ticketing.api
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  ticketing.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Host=eventdb;Port=5432;Database=TicketingDb;Username=postgres;Password=Eventbox123!
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Jwt__Issuer=Eventbox.Auth
      - Jwt__Audience=Eventbox.Api
      - Jwt__SigningKey=U7Sknna8IkRyXFXqDrXK6ON+GPq39d0QWAK2gEX0mljWQUFkqiaVGL2Wn0nPIHiT
    ports:
      - "8020:8080"
      - "8021:8081"
    depends_on:
      - eventdb
      - rabbitmq
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
